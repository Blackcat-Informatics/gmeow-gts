name: Release npm gmeow-gts

# On an npm-v* tag, verify and publish the @blackcatinformatics/gmeow-gts
# package to the npm registry via npm trusted publishing (OIDC) — no NPM_TOKEN.
# Requires a Trusted Publisher configured on npmjs.com for this package:
#   Publisher: GitHub Actions · Owner: Blackcat-Informatics · Repo: gmeow-gts
#   Workflow: release-npm.yaml · Environment: (none)

on:
  push:
    tags:
      - 'npm-v*'

concurrency:
  group: release-npm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate tag matches package version
        working-directory: ts
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#npm-v}"
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ts/package.json
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies
        working-directory: ts
        run: npm ci

      - name: Run tests
        working-directory: ts
        run: npm test

      - name: Build package
        working-directory: ts
        run: npm run build

      - name: Pack the tarball (for attestation + SBOM)
        working-directory: ts
        run: npm pack

      - name: Attest build provenance for the tarball
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ts/*.tgz

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ts
          format: spdx-json
          output-file: sbom-npm-gmeow-gts.spdx.json
          upload-artifact: false

      - name: Attest SBOM for npm tarball
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ts/*.tgz
          sbom-path: sbom-npm-gmeow-gts.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-npm-gmeow-gts
          path: sbom-npm-gmeow-gts.spdx.json

      - name: Publish to npm (trusted publishing / OIDC)
        working-directory: ts
        # No NODE_AUTH_TOKEN: npm authenticates via the GitHub OIDC token and the
        # configured Trusted Publisher; npm's own sigstore provenance is generated
        # automatically (in addition to the GitHub attestation above).
        # A prerelease MUST carry an explicit dist-tag: npm refuses
        # `npm publish` outright for one ("You must specify a tag using --tag
        # when publishing a prerelease version"), because the default would be
        # `latest` and every plain `npm install` would silently pick up a
        # release candidate. Publish prereleases under `next` and let only a
        # final release take `latest`.
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          case "$version" in
            *-*) echo "prerelease $version -> dist-tag next"
                 npm publish --access public --tag next ;;
            *)   echo "release $version -> dist-tag latest"
                 npm publish --access public ;;
          esac
