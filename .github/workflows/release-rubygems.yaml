name: Release RubyGems gmeow-gts

# On a ruby-v* tag, verify and publish the source-only Ruby FFI wrapper to
# RubyGems through Trusted Publishing/OIDC. No RubyGems API token is expected.

on:
  push:
    tags:
      - 'ruby-v*'

concurrency:
  group: release-rubygems-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.4'
          bundler-cache: false

      - name: Install Ruby dependencies
        working-directory: ruby
        run: bundle install

      - name: Validate tag matches gem version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#ruby-v}"
          gem_version="$(ruby -I ruby/lib -rgmeow/gts -e 'print Gmeow::Gts::VERSION')"
          if [ "$tag_version" != "$gem_version" ]; then
            echo "Tag version $tag_version does not match ruby/lib/gmeow/gts.rb version $gem_version"
            exit 1
          fi
          echo "GTS_RUBY_VERSION=${gem_version}" >> "$GITHUB_ENV"

      - name: Build C ABI library
        run: cargo build --manifest-path rust/capi/Cargo.toml

      - name: Ruby syntax, gem build, install, and smoke
        run: |
          set -euo pipefail
          ruby -c ruby/lib/gmeow/gts.rb
          bash ruby/scripts/smoke.sh

      - name: Build release gem
        run: |
          set -euo pipefail
          mkdir -p ruby/pkg
          rm -f ruby/pkg/*.gem
          # Build from inside ruby/. The gemspec computes spec.files with
          # Dir.chdir(root) so they are relative to ruby/, but `gem build`
          # resolves them against the CURRENT directory -- running it from the
          # repository root made RubyGems look for ./lib/gmeow/gts.rb and fail
          # validation with `["lib/gmeow/gts.rb"] are not files`. The wrapper
          # dry run has always cd'd into ruby/ first, which is why it passed
          # while this lane could not build at all.
          ( cd ruby && gem build gmeow-gts.gemspec --output "pkg/gmeow-gts-${GTS_RUBY_VERSION}.gem" )

      - name: Attest build provenance for the gem
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ruby/pkg/*.gem

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ruby
          format: spdx-json
          output-file: sbom-ruby-gmeow-gts.spdx.json
          upload-artifact: false

      - name: Attest SBOM for the gem
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ruby/pkg/*.gem
          sbom-path: sbom-ruby-gmeow-gts.spdx.json

      - name: Upload RubyGems artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rubygems-gmeow-gts
          path: ruby/pkg/*.gem
          if-no-files-found: error

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-ruby-gmeow-gts
          path: sbom-ruby-gmeow-gts.spdx.json

      - name: Configure RubyGems trusted publishing credentials
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Publish to RubyGems
        run: gem push ruby/pkg/*.gem
