name: Supply chain

# Fail the build on a dependency with a known vulnerability, per ecosystem.
# Dependabot opens upgrade PRs; this gate stops a known-vulnerable dependency
# from shipping. Runs on PRs touching a lockfile, on main, and weekly (so newly
# disclosed advisories surface even without a code change).

on:
  pull_request:
    paths:
      - "rust/Cargo.lock"
      - "go/go.sum"
      - "ts/package-lock.json"
      - "python/uv.lock"
      - ".github/workflows/security.yml"
  push:
    branches: [main]
  schedule:
    - cron: "13 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - run: cargo install cargo-audit --locked
      - name: cargo audit
        working-directory: rust
        run: cargo audit

  go-vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck
        working-directory: go
        run: govulncheck ./...

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ts/package.json
      - name: npm audit
        working-directory: ts
        run: |
          npm ci
          npm audit --audit-level=high

  python-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: pip-audit
        working-directory: python
        run: |
          uv sync --extra rdf
          uv run --with pip-audit pip-audit
