name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Package versions and docs
        run: bash scripts/check-versions.sh

      - name: Prepare quality-budget review base
        if: github.event_name == 'pull_request'
        env:
          QUALITY_BUDGET_LABEL_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'quality-budget-baseline-increase') }}
          QUALITY_BUDGET_REVIEW_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$QUALITY_BUDGET_REVIEW_BASE"
          echo "GTS_QUALITY_BUDGET_REVIEW_BASE=$QUALITY_BUDGET_REVIEW_BASE" >> "$GITHUB_ENV"
          if [ "$QUALITY_BUDGET_LABEL_APPROVED" = "true" ]; then
            echo "GTS_QUALITY_BUDGET_BASELINE_INCREASE_APPROVED=1" >> "$GITHUB_ENV"
          fi

      - name: Repository contracts
        run: |
          python scripts/check_cli_parity.py
          python scripts/check_api_parity.py
          python scripts/check_advanced_contract.py
          python scripts/check_ecosystem_contract.py
          python scripts/check_rust_wasm_dependency_audit.py
          python scripts/check_security_contract.py
          python scripts/check_crypto_deferrals.py
          python scripts/check_quality_budget.py
          python scripts/check_vector_manifest.py
          python scripts/check_vector_manifest.py --self-test

      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Pre-commit (format, spelling, YAML/MD/shell/actions, secrets, REUSE)
        run: pipx run pre-commit run --all-files --show-diff-on-failure

  # Rust engine: build + test on every OS; format/clippy/wasm once on Linux.
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            rust
            rust/capi

      - name: Format gate
        if: runner.os == 'Linux'
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --check
          cargo fmt --manifest-path rust/capi/Cargo.toml --check

      - name: Clippy (warnings are errors)
        if: runner.os == 'Linux'
        run: |
          cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path rust/Cargo.toml --all-targets --features duckdb -- -D warnings
          cargo clippy --manifest-path rust/Cargo.toml --all-targets --features rdf -- -D warnings
          cargo clippy --manifest-path rust/Cargo.toml --all-targets --features rdf-codecs -- -D warnings
          cargo clippy --manifest-path rust/Cargo.toml --all-targets --features native-store -- -D warnings
          cargo clippy --manifest-path rust/Cargo.toml --all-targets --features tar -- -D warnings
          cargo clippy --manifest-path rust/Cargo.toml --all-targets --features yaml-ld -- -D warnings
          cargo clippy --manifest-path rust/Cargo.toml --all-targets --all-features -- -D warnings
          cargo clippy --manifest-path rust/capi/Cargo.toml --all-targets -- -D warnings

      - name: Rustdoc (warnings are errors)
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --manifest-path rust/Cargo.toml --no-deps
          cargo doc --manifest-path rust/Cargo.toml --no-deps --features rdf-codecs
          cargo doc --manifest-path rust/Cargo.toml --no-deps --features yaml-ld
          cargo doc --manifest-path rust/capi/Cargo.toml --no-deps

      - name: Conformance corpus + CLI tests
        run: |
          cargo test --manifest-path rust/Cargo.toml --no-default-features
          cargo test --manifest-path rust/Cargo.toml
          cargo test --manifest-path rust/Cargo.toml --features duckdb
          cargo test --manifest-path rust/Cargo.toml --features rdf
          cargo test --manifest-path rust/Cargo.toml --features rdf-codecs
          cargo test --manifest-path rust/Cargo.toml --features native-store
          cargo test --manifest-path rust/Cargo.toml --features tar
          cargo test --manifest-path rust/Cargo.toml --features yaml-ld
          cargo test --manifest-path rust/Cargo.toml --all-features
          cargo test --manifest-path rust/capi/Cargo.toml

      - name: C ABI smoke test
        if: runner.os == 'Linux'
        run: bash rust/capi/scripts/smoke.sh

      - name: C++ C ABI wrapper smoke test
        if: runner.os == 'Linux'
        run: bash cpp/scripts/smoke.sh

      - name: .NET C ABI wrapper smoke test
        if: runner.os == 'Linux'
        run: bash dotnet/scripts/smoke.sh

      - name: PHP C ABI wrapper smoke test
        if: runner.os == 'Linux'
        run: bash php/scripts/smoke.sh

      - name: Lua C ABI wrapper smoke test
        if: runner.os == 'Linux'
        run: bash lua/scripts/smoke.sh

      - name: Swift C ABI wrapper smoke test
        if: runner.os == 'Linux'
        run: bash swift/scripts/smoke.sh

      - name: Ruby C ABI wrapper smoke test
        if: runner.os == 'Linux'
        run: bash ruby/scripts/smoke.sh

      - name: R C ABI wrapper smoke test
        if: runner.os == 'Linux'
        run: bash r/scripts/smoke.sh

      - name: Julia C ABI wrapper smoke test
        if: runner.os == 'Linux'
        run: bash julia/scripts/smoke.sh

      - name: Library builds for wasm32 (wasm-friendly claim)
        if: runner.os == 'Linux'
        run: |
          cargo build --manifest-path rust/Cargo.toml --lib --target wasm32-unknown-unknown
          cargo build --locked --manifest-path rust/Cargo.toml --lib --target wasm32-unknown-unknown --all-features

  # NOTE: the `downstream-gmeow-ontology` job was removed here. It appended a
  # `[patch.crates-io] gmeow-gts` entry to gmeow-ontology and ran
  # `cargo check -p gmeow-validate`, but gmeow-ontology no longer declares a
  # gmeow-gts dependency, so the patch never applied and the job compiled a
  # crate that does not use this one. Cargo said so in every run:
  # `warning: patch gmeow-gts v0.9.11 (...) was not used in the crate graph`.
  # It passed on every PR while testing nothing. Restore downstream coverage
  # only against a consumer that actually depends on the published crate, and
  # fail the job if that patch-unused warning ever appears again.

  # Credential-free package dry-runs for the C ABI wrapper family.
  wrapper-package-dry-runs:
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install native dry-run tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake curl git ninja-build pipx pkg-config unzip zip
          pipx install conan
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "${HOME}/vcpkg"
          "${HOME}/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=${HOME}/vcpkg" >> "${GITHUB_ENV}"
          echo "${HOME}/vcpkg" >> "${GITHUB_PATH}"

      - name: Wrapper package dry-runs
        run: bash scripts/package_dry_run_wrappers.sh

      - name: Upload package dry-run artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wrapper-package-dry-runs
          path: dist/package-dry-runs/
          if-no-files-found: ignore

  # Go engine: build + test on every OS; staticcheck/golangci once on Linux.
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Build
        working-directory: go
        run: go build ./...

      - name: Vet
        working-directory: go
        run: go vet ./...

      - name: staticcheck
        if: runner.os == 'Linux'
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1.4.1
        with:
          version: "2026.1"
          install-go: false
          working-directory: go

      - name: golangci-lint
        if: runner.os == 'Linux'
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.12.2
          working-directory: go
          args: --timeout=5m

      - name: Conformance corpus + CLI tests
        working-directory: go
        run: go test ./...

  # TypeScript engine: build + test on every OS; lint once on Linux.
  ts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ts/package.json

      - name: Install dependencies
        working-directory: ts
        run: npm ci

      - name: Lint
        if: runner.os == 'Linux'
        working-directory: ts
        run: npm run lint

      - name: Conformance corpus + CLI tests
        working-directory: ts
        run: npm test

      - name: Build package
        working-directory: ts
        run: npm run build

  # Python reference engine: build + test on every OS; lint/types/corpus once on Linux.
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Sync environment
        working-directory: python
        run: uv sync --extra rdf

      - name: Lint (ruff)
        if: runner.os == 'Linux'
        working-directory: python
        run: uv run ruff check .

      - name: Type-check (mypy)
        if: runner.os == 'Linux'
        working-directory: python
        run: uv run mypy

      - name: Conformance + unit tests
        working-directory: python
        run: uv run pytest

      - name: Corpus is reproducible from the oracle
        if: runner.os == 'Linux'
        working-directory: python
        run: |
          uv run python scripts/gen_vectors.py
          git diff --exit-code ../vectors

  # Smalltalk/Pharo parity engine: pinned runtime, SUnit conformance, and CLI support.
  smalltalk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build pinned Pharo runtime
        run: docker build -t gmeow-gts-smalltalk smalltalk

      - name: SUnit conformance and CLI parity tests
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" \
            --entrypoint /bin/sh gmeow-gts-smalltalk -lc \
            "sh /workspace/smalltalk/scripts/run-tests.sh"

  # Kotlin/JVM parity engine: Gradle build, tests, detekt, and CLI install smoke.
  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Gradle tests and detekt
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e GRADLE_USER_HOME=/tmp/gradle \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/kotlin \
            gradle:jdk21 gradle test detekt installDist --no-daemon

      - name: CLI smoke
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/kotlin \
            gradle:jdk21 /workspace/kotlin/build/install/gmeow-gts-kotlin/bin/gmeow-gts-kotlin \
            fold /workspace/vectors/01-minimal.gts

  # Live cross-engine interoperability: each engine reads every other's output.
  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ts/package.json

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Cross-engine interop
        run: bash scripts/interop.sh
