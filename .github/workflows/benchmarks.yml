name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      engines:
        description: "Comma-separated engines to benchmark."
        required: true
        default: "rust,python,go,ts,smalltalk"
      iterations:
        description: "Iterations per CLI benchmark command."
        required: true
        default: "3"
      vectors:
        description: "Comma-separated GTS vectors for read/fold benchmarks."
        required: true
        default: "vectors/01-minimal.gts,vectors/23-files-profile-tree.gts,vectors/25b-streamable-compacted.gts"

permissions:
  contents: read

jobs:
  release-benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ts/package.json

      - name: Run benchmark suite
        env:
          BENCH_ENGINES: ${{ inputs.engines }}
          BENCH_ITERATIONS: ${{ inputs.iterations }}
          BENCH_VECTORS: ${{ inputs.vectors }}
        run: |
          python scripts/bench_release_suite.py \
            --engines "$BENCH_ENGINES" \
            --iterations "$BENCH_ITERATIONS" \
            --vectors "$BENCH_VECTORS" \
            --out-dir dist/benchmarks/manual

      - name: Upload benchmark report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gts-release-benchmark-report
          path: dist/benchmarks/manual/
